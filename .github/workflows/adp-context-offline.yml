name: ADP context continuity offline tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  adp-context-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -B -m unittest discover -s tests -p 'test_engine.py' -v
      - run: python -B -m adp_context self-check
