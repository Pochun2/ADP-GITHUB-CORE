name: ADP context GitHub observation contracts (offline)
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  adp-context-github-observation-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Offline mock GitHub responses only
        run: python -B -m unittest discover -s tests -p 'test_github_evidence.py' -v
      - name: No credentials or writes
        run: python -B -m adp_context.github_evidence --self-check
